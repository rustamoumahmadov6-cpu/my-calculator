<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b10">
<title>CALCULATOR PRO</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#090b10;color:#f5f5f5;
 font-family:Arial,sans-serif;display:flex;justify-content:center;
 align-items:center;padding:16px
}
.app{width:100%;max-width:420px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{font-size:23px;font-weight:bold;letter-spacing:2px;color:#f2c14e}
.logo span{display:block;font-size:10px;color:#858b99;letter-spacing:4px;margin-top:5px}
.badge{border:1px solid #66501c;color:#f2c14e;border-radius:20px;padding:7px 10px;font-size:11px}
.panel{background:#121620;border:1px solid #272c38;border-radius:24px;padding:18px;box-shadow:0 15px 50px #0008}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.top button{background:#222735;color:#f2c14e;border:0;border-radius:10px;padding:9px 12px}
#history{font-size:12px;color:#8c94a5;min-height:18px;text-align:right;overflow-wrap:anywhere}
#display{width:100%;height:76px;background:transparent;border:0;outline:0;color:#fff;text-align:right;font-size:35px;font-weight:500}
#message{height:18px;text-align:right;color:#f2c14e;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
button{cursor:pointer;font-size:17px;font-weight:600;transition:filter .15s,transform .1s}
.key{height:55px;border:1px solid #2b3040;border-radius:15px;background:#202532;color:#f5f5f5}
.key:active{transform:scale(.96);filter:brightness(1.3)}
.fn{background:#191e2a;color:#f2c14e}
.op{background:#332a18;color:#ffd36b;border-color:#51401d}
.clear{background:#402126;color:#ff858b;border-color:#613038}
.equal{background:#e6b844;color:#17130a;border-color:#e6b844;font-size:24px}
.zero{grid-column:span 2}
.footer{text-align:center;color:#606878;font-size:11px;margin-top:17px;letter-spacing:1px}
.section{color:#8b93a3;font-size:11px;margin:17px 0 9px;letter-spacing:2px}
#historyList{margin-top:14px;max-height:140px;overflow:auto}
.hist{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #282d39;font-size:12px;color:#aeb5c3}
.hist b{color:#f2c14e;overflow-wrap:anywhere;text-align:right}
@media(max-width:360px){.key{height:49px;font-size:15px}.panel{padding:12px}#display{font-size:29px}}
</style>
</head>
<body>
<div class="app">
 <div class="header">
  <div class="logo">CALCULATOR<span>PRO EDITION</span></div>
  <div class="badge">● ADVANCED</div>
 </div>

 <div class="panel">
  <div class="top">
   <button onclick="toggleAngle()" id="angleBtn">DEG</button>
   <button onclick="backspace()">⌫</button>
  </div>

  <div id="history">Ҳисобкунаки илмӣ</div>
  <input id="display" value="0" readonly aria-label="Натиҷаи ҳисоб">
  <div id="message"></div>

  <div class="grid">
   <button class="key clear" onclick="clearAll()">AC</button>
   <button class="key fn" onclick="append('(')">(</button>
   <button class="key fn" onclick="append(')')">)</button>
   <button class="key op" onclick="append('/')">÷</button>

   <button class="key fn" onclick="append('sin(')">sin</button>
   <button class="key fn" onclick="append('cos(')">cos</button>
   <button class="key fn" onclick="append('tan(')">tan</button>
   <button class="key op" onclick="append('*')">×</button>

   <button class="key fn" onclick="append('log(')">log</button>
   <button class="key fn" onclick="append('ln(')">ln</button>
   <button class="key fn" onclick="append('sqrt(')">√</button>
   <button class="key op" onclick="append('-')">−</button>

   <button class="key fn" onclick="append('^2')">x²</button>
   <button class="key fn" onclick="append('^')">xʸ</button>
   <button class="key fn" onclick="append('pi')">π</button>
   <button class="key op" onclick="append('+')">+</button>

   <button class="key" onclick="append('7')">7</button>
   <button class="key" onclick="append('8')">8</button>
   <button class="key" onclick="append('9')">9</button>
   <button class="key fn" onclick="percent()">%</button>

   <button class="key" onclick="append('4')">4</button>
   <button class="key" onclick="append('5')">5</button>
   <button class="key" onclick="append('6')">6</button>
   <button class="key fn" onclick="append('!')">n!</button>

   <button class="key" onclick="append('1')">1</button>
   <button class="key" onclick="append('2')">2</button>
   <button class="key" onclick="append('3')">3</button>
   <button class="key fn" onclick="append('e')">e</button>

   <button class="key zero" onclick="append('0')">0</button>
   <button class="key" onclick="append('.')">.</button>
   <button class="key equal" onclick="calculate()">=</button>
  </div>

  <div class="section">ТАЪРИХИ ҲИСОБҲО</div>
  <button class="key fn" style="width:100%;height:38px" onclick="clearHistory()">Пок кардани таърих</button>
  <div id="historyList"></div>
 </div>

 <div class="footer">CALCULATOR PRO • SMART • FAST</div>
</div>

<script>
const display = document.getElementById('display');
const historyBox = document.getElementById('history');
const message = document.getElementById('message');
const historyList = document.getElementById('historyList');

let expression = '0';
let angle = 'DEG';
let justCalculated = false;
let records = [];

function render(){
 display.value = expression;
}

function append(value){
 message.textContent = '';

 if(justCalculated && /[0-9.]|pi|e|sin|cos|tan|log|ln|sqrt/.test(value)){
  expression = '0';
 }
 justCalculated = false;

 if(expression === '0' && /^[0-9]$/.test(value)){
  expression = value;
 }else if(expression === '0' && value === '.'){
  expression = '0.';
 }else{
  expression += value;
 }

 render();
}

function clearAll(){
 expression = '0';
 justCalculated = false;
 historyBox.textContent = 'Ҳисобкунаки илмӣ';
 message.textContent = '';
 render();
}

function backspace(){
 if(justCalculated){clearAll();return}
 expression = expression.length > 1 ? expression.slice(0,-1) : '0';
 render();
}

function toggleAngle(){
 angle = angle === 'DEG' ? 'RAD' : 'DEG';
 document.getElementById('angleBtn').textContent = angle;
}

function percent(){
 try{
  const result = evaluate(expression) / 100;
  expression = format(result);
  render();
  justCalculated = true;
 }catch(e){
  message.textContent = 'Аввал ифодаи дуруст ворид кун';
 }
}

function format(number){
 if(!Number.isFinite(number)) throw Error('Натиҷа муайян нест');
 if(Math.abs(number) < 1e-12) number = 0;
 return Number(number.toPrecision(12)).toString();
}

function evaluate(source){
 let s = source.replace(/\s/g,'');
 if(!s || !/^[0-9+\-*/().!^a-z]+$/i.test(s)){
  throw Error('Ифода нодуруст аст');
 }

 // Амалиёти факториал
 s = s.replace(/(\d+(?:\.\d+)?|pi|e|\([^()]*\))!/gi,
  'fact($1)');

 // Дараҷа
 s = s.replace(/\^/g,'**');

 // Функсияҳои иҷозатшуда
 const allowed = {
  pi:'Math.PI',
  e:'Math.E',
  sin:'sin',
  cos:'cos',
  tan:'tan',
  log:'Math.log10',
  ln:'Math.log',
  sqrt:'Math.sqrt',
  fact:'fact'
 };

 s = s.replace(/\b(sin|cos|tan|log|ln|sqrt|pi|e|fact)\b/gi,
  name => allowed[name.toLowerCase()] || name);

 const sin = x => Math.sin(angle === 'DEG' ? x*Math.PI/180 : x);
 const cos = x => Math.cos(angle === 'DEG' ? x*Math.PI/180 : x);
 const tan = x => Math.tan(angle === 'DEG' ? x*Math.PI/180 : x);

 function fact(n){
  if(!Number.isInteger(n) || n < 0 || n > 170){
   throw Error('Факториал танҳо барои адади бутуни 0–170');
  }
  let r = 1;
  for(let i=2;i<=n;i++) r *= i;
  return r;
 }

 // Танҳо ифодаи математикии филтршуда иҷро мешавад.
 const result = Function(
  'sin','cos','tan','fact',
  '"use strict"; return ('+s+');'
 )(sin,cos,tan,fact);

 if(typeof result !== 'number' || !Number.isFinite(result)){
  throw Error('Натиҷа муайян нест');
 }
 return result;
}

function calculate(){
 try{
  const original = expression;
  const result = format(evaluate(original));
  historyBox.textContent = original + ' =';
  expression = result;
  records.unshift({question:original,answer:result});
  records = records.slice(0,20);
  renderHistory();
  render();
  message.textContent = 'Ҳисоб бомуваффақият анҷом ёфт';
  justCalculated = true;
 }catch(e){
  message.textContent = 'Хато: ифодаро санҷ';
 }
}

function renderHistory(){
 historyList.innerHTML = '';
 records.forEach(item=>{
  const row = document.createElement('div');
  row.className = 'hist';
  const q = document.createElement('span');
  const a = document.createElement('b');
  q.textContent = item.question + ' =';
  a.textContent = item.answer;
  row.append(q,a);
  historyList.appendChild(row);
 });
}

function clearHistory(){
 records = [];
 renderHistory();
}

document.addEventListener('keydown',event=>{
 if(/^[0-9.]$/.test(event.key)){
  append(event.key);
 }else if(['+','-','*','/','(',')','^'].includes(event.key)){
  append(event.key);
 }else if(event.key === 'Enter' || event.key === '='){
  calculate();
 }else if(event.key === 'Backspace'){
  backspace();
 }else if(event.key === 'Escape'){
  clearAll();
 }
});

render();
</script>
</body>
</html>
