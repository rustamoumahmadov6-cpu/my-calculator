<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калкулятори Замонавӣ ва Мукаммал</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
        }

        .calculator {
            background-color: #2b2d42;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            width: 340px;
        }

        .display {
            width: 100%;
            height: 70px;
            background-color: #1a1a24;
            color: #ffffff;
            font-size: 1.8rem;
            text-align: right;
            padding: 15px;
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
            outline: none;
            overflow-x: auto;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 15px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #3f3f59;
            color: #ffffff;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #52527a;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-operator {
            background-color: #4361ee;
        }

        .btn-operator:hover {
            background-color: #3a0ca3;
        }

        .btn-action {
            background-color: #e63946;
        }

        .btn-action:hover {
            background-color: #d90429;
        }

        .btn-equal {
            background-color: #2a9d8f;
            grid-column: span 2;
        }

        .btn-equal:hover {
            background-color: #21867a;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" class="display" id="display" disabled>
        <div class="buttons">
            <button class="btn-action" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('%')">%</button>
            <button onclick="appendValue('Math.sqrt(')">√</button>
            <button class="btn-operator" onclick="appendValue('/')">/</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="btn-operator" onclick="appendValue('*')">*</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="btn-operator" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="btn-operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="btn-equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendValue(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = '';
        }

        function calculate() {
            try {
                // Истифодаи eval барои ҳисобкунии ибораҳои математикӣ
                display.value = eval(display.value);
            } catch (error) {
                display.value = 'Хатогӣ';
                setTimeout(clearDisplay, 1500);
            }
        }
    </script>

</body>
</html>
